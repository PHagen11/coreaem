<div class="build-a-boat-navigation show-for-medium">
	<ul class="tabs" data-deep-link="true" data-update-history="true" data-deep-link-smudge="true" data-deep-link-smudge-delay="500" data-tabs id="bab-tabs">
		<li class="tabs-title is-active"><a href="#motor" aria-selected="true">Motor</a></li>
		<li class="tabs-title"><a data-tabs-target="colors" href="#colors">Color</a></li>
		<li class="tabs-title"><a data-tabs-target="options" href="#options">Options</a></li>
		<li class="tabs-title"><a data-tabs-target="summary" href="#summary">Summary</a></li>
	</ul>
</div>
<div class="grid-x build-a-boat">
		<div class="tabs-content" data-tabs-content="bab-tabs">
			<div class="tabs-panel is-active" id="motor">
				<div class="grid-x">
					<div class="cell large-8">
						{{> bab-motor}}
					</div>
					<div class="cell large-4">
						<div clas="bab-sum-col">
							{{> bab-sum-column}}
						</div>
					</div>
				</div>
				<div class="hide-for-medium mobile-bab-nav">
					<a class="button primary expanded" href="#options">Next: Options</a>
				</div>
			</div>
			<div class="tabs-panel" id="options">
				<div class="grid-x">
					<div class="cell large-8">
						{{> bab-options}}
					</div>
					<div class="cell large-4">
						<div clas="bab-sum-col">
							{{> bab-sum-column}}
						</div>
					</div>
				</div>
				<div class="hide-for-medium mobile-bab-nav">
					<a class="button primary expanded" href="#colors">Next: Colors</a>
					<a class="button back expanded" href="#motor">Back</a>
				</div>
			</div>
			<div class="tabs-panel" id="colors">
				<div class="grid-x">
					<div class="cell large-8">
						{{> bab-color}}
					</div>
					<div class="cell large-4">
						<div clas="bab-sum-col">
							{{> bab-sum-column}}
						</div>
					</div>
				</div>

			</div>
			<div class="tabs-panel" id="summary">
				<div class="grid-container">
					{{> bab-summary}}
				</div>
				<div class="hide-for-medium mobile-bab-nav">
					<a class="button primary expanded">Next: Send To Dealer</a>
					<a class="button back expanded" href="#colors">Back</a>
				</div>
			</div>
		</div>
</div>
{{> bab-header}}
