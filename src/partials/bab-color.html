<div class="bab-color build-a-boat">
  <div class="bab-step-heading text-center large-text-left">Select Your Color:</div>
  <div class="cell small-12 boat-image show-for-medium">
    <img src="/assets/img/side.jpg">
  </div>
  <div class="grid-x grid-margin-x">
    <div class="cell small-12 text-center">
      <div class="swatch" onclick="activate(this);">
        <div class="swatch-circle-highlight">
          <div class="swatch-circle custom">
            <div class="stripe" style="background-color:#8a1222;"></div>
          </div>
        </div>
        <div class="swatch-name">ZPR107</div>
      </div>
      <div class="swatch" onclick="activate(this);">
        <div class="swatch-circle-highlight">
          <div class="swatch-circle custom">
            <div class="stripe" style="background-color:#192c5b;"></div>
          </div>
        </div>
        <div class="swatch-name">ZPR107</div>
      </div>
      <div class="swatch" onclick="activate(this);">
        <div class="swatch-circle-highlight">
          <div class="swatch-circle custom">
            <div class="stripe" style="background-color:black;"></div>
          </div>
        </div>
        <div class="swatch-name">ZPR107</div>
      </div>
    </div>
  </div>
</div>



<div class="hide-for-medium">
  <div class="grid-container">
    <div class="grid-x" id="stickunhook">
      {{> bab-sum-column}}
    </div>
  </div>
</div>


<div class="hide-for-medium mobile-bab-nav">
  <a class="button primary expanded">Next: Options</a>
  <a class="button back expanded">Back</a>
</div>

<script type="text/javascript">
  function activate(elem) {
    var a = document.getElementsByClassName('swatch');
    for (i = 0; i < a.length; i++) {
      a[i].classList.remove('selected')
    }
    elem.classList.add('selected');
  };
</script>
