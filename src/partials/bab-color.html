<div class="bab-color build-a-boat">
  <div class="bab-step-heading text-center large-text-left">Select Your Color:</div>
  <div class="cell small-12 boat-image show-for-medium">
    <div class="grid-x">
      <div class="cell small-12 small-bottom">
        <div class="image-carousel">
          <div class="owl-carousel owl-theme" data-slider-id="1">
            <div><img src="/assets/img/side.jpg"></div>
            <div><img src="/assets/img/side.jpg"></div>
            <div><img src="/assets/img/side.jpg"></div>
          </div>
          <div class="owl-thumbs text-center tiny-top" data-slider-id="1">
            <button class="owl-thumb-item"><img src="/assets/img/side.jpg"></button>
            <button class="owl-thumb-item"><img src="/assets/img/side.jpg"></button>
            <button class="owl-thumb-item"><img src="/assets/img/side.jpg"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="grid-x grid-margin-x">
    <div class="cell small-12 text-center">
      <div class="swatch" onclick="activate(this);">
        <div class="swatch-circle-highlight">
          <div class="swatch-circle custom">
            <div class="stripe" style="background-color:#8a1222;"></div>
          </div>
        </div>
        <div class="swatch-name">Apple Red</div>
      </div>
      <div class="swatch" onclick="activate(this);">
        <div class="swatch-circle-highlight">
          <div class="swatch-circle custom">
            <div class="stripe" style="background-color:#192c5b;"></div>
          </div>
        </div>
        <div class="swatch-name">Ocean Blue</div>
      </div>
      <div class="swatch" onclick="activate(this);">
        <div class="swatch-circle-highlight">
          <div class="swatch-circle custom">
            <div class="stripe" style="background-color:black;"></div>
          </div>
        </div>
        <div class="swatch-name text-center">Deep Black</div>
      </div>
    </div>
  </div>
</div>
