<div class="reveal large" id="dealer-select-modal-container"
data-reveal data-close-on-click="true"
data-animation-in="slide-in-up-custom"
data-animation-out="slide-out-up-custom">
  <div class="dealer-select-modal">

    <div class="grid-x header">
      <div class="cell small-12 text-center">
        <div class="header-message">
          Choose a Dealer Near You
        </div>
        <div class="message">
          To view price with dealer prep and freight, use the search box to locate and choose a dealer near you.
        </div>
      </div>
      <div class="cell small-1">
        <button class="close-button" data-close aria-label="Close modal" type="button">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="cell small-12">
        <form class="search-form">
          <div class="search-bar grid-x">

            <i class="fas fa-search search-icon"></i>
            <i class="fas fa-chevron-down arrow-icon" id="dropdown-icon"></i>
            
            <select id="radius-input" name="miles" class="miles align-self-middle" id="miles-dropdown">
              <option value="100" selected>100 Miles</option>
              <option value="250">250 Miles</option>
              <option value="500">500 Miles</option>
            </select>
            
            <input class="input-field" type="text" id="dealer" name="dealer" placeholder="Zip, City">
  
          </div>
        </form>
      </div>
      <div class="cell small-12">
        <div class="grid-x align-center">
          <div class="cell small-7 medium-6 text-center medium-text-right">
            <div class="use-location">
              <a href="javascript: void();" class="location-icon"> Use My Current Location</a>
            </div>
          </div>
          
          <div class="cell small-5 medium-6 text-center medium-text-left">
            <div class="advance-search">
              <a href="#" class="search-link">Advanced Search</a>
            </div>
          </div>
        </div>
      </div>
    </div>
