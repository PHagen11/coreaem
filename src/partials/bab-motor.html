<div class="bab-motors">
    <div class="bab-step-heading">Select a Motor:</div>


    <form>
        <div class="grid-xgrid-padding-x">
            <div class="cell auto shrink">&nbsp;</div>
            <div class="cell auto">
                <div class="grid-x grid-padding-x headings show-for-medium">
                    <div class="cell medium-6">
                        AVAILABLE MOTOR
                    </div>
                    <div class="cell medium-3">
                        ESTIMATED SPEED
                    </div>
                    <div class="cell medium-3">
                        NO HAGGLE NO HASSLE&trade; National Price
                    </div>
                </div>
            </div>
        </div>

        <div class="grid-x grid-padding-x">
            <div class="cell category">
                Mercury&reg; Pro XS
            </div>
        </div>

        <div class="grid-x grid-padding-x motor-listing">
            <div class="cell auto shrink">
                <input type="radio" name="motor" id="motor1" val="motorIDorWhateverElse" checked>
            </div>
            <div class="cell auto">
                <label for="motor1">
                    <div class="grid-x grid-padding-x">
                        <div class="cell medium-6">
                            60 ELPT FourStroke
                        </div>
                        <div class="cell medium-3">
                            66-68 mph
                        </div>
                        <div class="cell medium-3 price-vals">
                            <span class="price-sale-value">$ 24,195</span>
                            <span class="price-value strike">$ 25,195</span>
                            <div class="price-save-value">Save: $ 1,000</div>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <div class="grid-x grid-padding-x motor-listing">
            <div class="cell auto shrink">
                <input type="radio" name="motor" id="motor2" val="motorIDorWhateverElse">
            </div>
            <div class="cell auto">
                <label for="motor2">
                    <div class="grid-x grid-padding-x">
                        <div class="cell medium-6">
                            250 L Verado® Pro FourStroke
                        </div>
                        <div class="cell medium-3">
                            69-71 mph
                        </div>
                        <div class="cell medium-3 price-vals">
                            <span class="price-value">$30,995</span>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <div class="grid-x grid-padding-x motor-listing">
            <div class="cell auto shrink">
                <input type="radio" name="motor" id="motor3" val="motorIDorWhateverElse">
            </div>
            <div class="cell auto">
                <label for="motor3">
                    <div class="grid-x grid-padding-x">
                        <div class="cell medium-6">
                            300 L OptiMax® Pro XS w/Torque Master
                        </div>
                        <div class="cell medium-3">
                            73-75 mph
                        </div>
                        <div class="cell medium-3 price-vals">
                            <span class="price-value">$32,995</span>
                        </div>
                    </div>
                </label>
            </div>
        </div>

    </form>

</div>
