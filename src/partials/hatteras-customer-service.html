    <script>
      // conditions for currently own a boat dropdown
      let ownBoatSelect = document.getElementById("ownBoat");
      let boatTypeInput = document.getElementById("boatTypeInput");
      let boatTypeParent = boatTypeInput.parentElement.parentElement;
      let boatStorageInput = document.getElementById("boatStorageInput");
      let boatStorageParent = boatStorageInput.parentElement.parentElement;

      // conditions for do you have a broker dropdown
      let brokerSelect = document.getElementById("brokerSelect");
      let brokerInput = document.getElementById("brokerInput");
      let brokerInputParent = brokerInput.parentElement.parentElement;

      // console.log(boatTypeParent)

      ownBoatSelect.addEventListener("change", function() {
        // console.log(ownBoatSelect.value)
        if (ownBoatSelect.value == "yes") {
          boatTypeParent.classList.remove("hide");
          boatStorageParent.classList.remove("hide");
        } else {
          boatTypeParent.classList.add("hide");
          boatStorageParent.classList.add("hide");
        }
      })

      brokerSelect.addEventListener("change", function() {
        // console.log(brokerSelect.value)
        if (brokerSelect.value == "yes") {
          brokerInputParent.classList.remove("hide");
        } else {
          brokerInputParent.classList.add("hide");
        }
      })
    </script>
