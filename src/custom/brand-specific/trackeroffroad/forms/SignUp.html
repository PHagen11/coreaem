<div class="form">
    <form id="form4" data-abide novalidate>
        <div data-abide-error class="alert callout" style="display: none;">
            <p>
                <i class="fas fa-exclamation-triangle fa-xs">
                </i> There are some errors in your form.
            </p>
        </div>
        <div class="grid-x">
            <div class="small-12 cell">
                <label>Email* <input name="email" type="text" id="emailInput" placeholder="" required pattern="email" />
                    <span class="form-error" data-form-error-for="emailInput">Email address is required in standard
                        email format.</span>
                </label>
            </div>
            <div class="medium-12 cell">
                <div id="recaptcha_4" class="g-recaptcha" data-sitekey="6Ldrjo4UAAAAABY3ZWa0FAG529uHVwvxaNhQugCI"
                    data-callback="onSubmit" data-size="invisible">
                </div>
            </div>
            <!-- hidden fields -->
            <input name="leadTypeId" type="hidden" value="2" />
            <input name="reasonForContactID" type="hidden" value="0" />
            <input name="formType" type="hidden" value="SignUp" />
            <input name="brand" type="hidden" value="TrackerOffRoad" />
            <input name="source" type="hidden" value="Tracker Off Road Website" />
            <input name="url" type="hidden" value="/stay-informed.html" />
            <input name="captchaName" type="hidden" value="invisiblev2" />
            <!-- end hidden fields -->
            <div class="small-12 cell hide-for-medium text-center">
                <button class="button expanded formSubmit submitButton" type="submit" value="Submit">Sign Up</button>
            </div>
            <div class="small-12 cell show-for-medium text-center">
                <button class="button formSubmit submitButton" type="submit" value="Submit">Sign Up</button>
            </div>
            <div id="loader">
            </div>
        </div>
    </form>
</div>
