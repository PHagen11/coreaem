		<div class="cell small-12 large-12 sections" id="sections">

			<!-- GLOBAL TOP MINI NAV -->

			<section id="mini-nav" data-magellan-target="mini-nav" class="large-bottom">

				<h5 class="medium-bottom">Mini Nav</h5>
				{{> mini-nav}}
			</section>

			<!-- HEADER -->

			<section id="header" data-magellan-target="header" class="large-bottom">
				<h5 class="medium-bottom">Header</h5>
				{{> header}}
			</section>

			<!-- FOOTER -->

			<section id="footer" data-magellan-target="footer" class="large-bottom">
				<h5 class="medium-bottom">Footer</h5>
				{{> footer}}
			</section>

			<section id="link-list" data-magellan-target="link-list" class="large-bottom">
				<h5 class="medium-bottom">Link List</h5>

			</section>

			<section id="sub-navigation" data-magellan-target="sub-navigation" class="large-bottom">
				<h5 class="medium-bottom">Sub Navigation</h5>
